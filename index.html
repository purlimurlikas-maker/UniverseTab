  <p class="timeelement" id="timeElement">Time</p>
    <script>
      function updateTime() {
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.textContent = currentTime;
      }

      updateTime();
      setInterval(updateTime, 1000);
    </script>
