<!doctype html>
<html lang="en">
  <body background="https://i.pinimg.com/originals/0e/0d/72/0e0d72395ecbc6682ea8e7276bc6fe06.gif">
  <head>
  <link rel="stylesheet" href="src/style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title class="orbitron">UniverseTab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Petrona:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  
  <div class="top-bar">
    <a class="nav-button" href="https://purlimurlikas-maker.github.io/Space-fact/" target="_blank">All-knowing Space Tortoise</a>

    <div class="dictionary-panel">
      <h4>English dictionary</h4>

      <div class="dictionary-controls">
        <input id="word" class="dictionary-input" type="text" placeholder="Enter a word" />
        <button id="lookup" class="dictionary-button">Look up</button>
      </div>

      <div id="result" class="dictionary-result" aria-live="polite"></div>
    </div>
  </div>

  <header class="title-wrap">
  <p class="timeelement" id="timeElement">Time</p>
    <script>
      function updateTime() {
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.textContent = currentTime;
      }

      updateTime();
      setInterval(updateTime, 1000);
    </script>
  
<h1> UniverseTab </h1>
</header>



<form class="search-form" action="https://www.google.com/search" method="get" target="_blank">
  <input type="search" name="q" placeholder="Look something up..." />
  <button type="submit">Search</button>
</form>

<div class="app-bar">
  <div class="app-tile" id="youtube-app">
    <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" aria-label="Open YouTube">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:block; border-radius:12px; background:#fff; padding:0;">
        <path d="M23.5 6.2a2.9 2.9 0 0 0-2.05-2.06C19.6 3.5 12 3.5 12 3.5s-7.6 0-9.45.62A2.9 2.9 0 0 0 .5 6.2 30.1 30.1 0 0 0 0 12a30.1 30.1 0 0 0 .5 5.8 2.9 2.9 0 0 0 2.05 2.06C4.4 20.5 12 20.5 12 20.5s7.6 0 9.45-.62A2.9 2.9 0 0 0 23.5 17.8 30.1 30.1 0 0 0 24 12a30.1 30.1 0 0 0-.5-5.8z" fill="#FF0000"/>
        <path d="M9.75 15.02V8.98L15.5 12l-5.75 3.02z" fill="#fff"/>
      </svg>
    </a>
  </div>

  <div class="app-tile" id="slack-app">
    <a href="https://app.slack.com/" target="_blank" rel="noopener noreferrer" aria-label="Open Slack">
      <img
        src="https://a.slack-edge.com/80588/marketing/img/icons/icon_slack_hash_colored.png"
        alt="Slack"
        width="48"
        height="48"
        style="display:block; border-radius:12px; background:#fff; padding: 10px;"
      />
    </a>
  </div>

  <div class="app-tile spotify-app" id="spotify-app">
    <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer" aria-label="Open Spotify">
      <img
        src="https://storage.googleapis.com/pr-newsroom-wp/1/2023/05/Spotify_Primary_Logo_RGB_Green.png"
        alt="Spotify"
        width="48"
        height="48"
        style="display:block; border-radius:12px; background:#000000; padding: 10px;"
      />
    </a>
  </div>

  <div class="app-tile NASA-app" id="NASA-app">
    <a href="https://www.nasa.gov" target="_blank" rel="noopener noreferrer" aria-label="Open NASA">
      <img
        src="https://www.nasa.gov/wp-content/uploads/2023/04/nasa-logo-web-rgb.png"
        alt="NASA"
        width="48"
        style="display:block; border-radius:12px; padding: 10px;"
      />
    </a>
  </div>
</div>


    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
